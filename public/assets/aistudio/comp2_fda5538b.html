<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>Pixel Studio — Compositor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================
   VARIABLES
   ============================================================ */
:root {
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --chrome: #c8c8c8; --chrome-light: #efe8dc; --chrome-dark: #9a9a96;
  --bg: #fbfbfa; --bg-hover: #e4dbc8; --bg-active: #20242b;
  --fg: #1c1a15; --fg-muted: #6a6358; --fg-inv: #fbfbfa;
  --border-strong: #4a4233; --border-soft: #bab0a0; --border-hair: #ddd5c6;
  --accent-core: #5a6ea8;
  --dur-fast: 90ms; --dur-base: 150ms; --dur-slow: 220ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --touch-min: 44px;
}

* { margin:0; padding:0; box-sizing:border-box; border-radius:0; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family: 'Silkscreen', 'VT323', 'MS Sans Serif', Tahoma, ui-monospace, monospace; font-size: 18px; line-height: 1.0; -webkit-font-smoothing: none; -webkit-user-select:none; user-select:none; touch-action:auto; }
#app { border:1px solid #6b6b68; display:flex; flex-direction:column; height:100dvh; }

/* ============================================================
   BASE UI SHELL
   ============================================================ */
#topbar { flex-shrink:0; display:flex; align-items:center; height:36px; padding:0 3px; padding-top: env(safe-area-inset-top); box-sizing: content-box; background:var(--chrome); border-bottom:1px solid var(--border-strong); z-index:30; gap: 3px; box-shadow: inset 0 -1px 0 var(--chrome-dark); }
.top-btn { appearance:none; border:0; background:transparent; color:var(--fg); width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; transition:background var(--dur-fast) var(--ease); }
.top-btn svg { display:block; width:18px; height:18px; }
.top-spacer { flex:1; }
#workspace { flex:1; display:flex; position:relative; overflow:hidden; }
#toolRail { width:48px; flex-shrink:0; background:var(--chrome); border-right:1px solid var(--border-strong); display:flex; flex-direction:column; z-index:5; box-shadow: inset -1px 0 0 var(--chrome-dark), inset 1px 0 0 var(--chrome-light); overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
#toolRail::-webkit-scrollbar { display:none; }
#topTools { display:flex; flex-direction:column; flex-shrink:0; }
.t-btn { appearance:none; border:0; background:var(--chrome-light); color:var(--fg); width:100%; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; transition:background var(--dur-fast) var(--ease); position:relative; }
.t-btn svg { display:block; width:20px; height:20px; }
.t-btn.active { background:var(--bg-active); color:var(--fg-inv); }
.t-btn.active::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; background:var(--accent-core); }

#viewport { flex:1; position:relative; overflow:hidden; background:var(--chrome-dark); touch-action:none; }
#c { position:absolute; inset:0; width:100%; height:100%; image-rendering:auto; touch-action:none; }

#sidePanelScrim { position:fixed; top:calc(36px + env(safe-area-inset-top)); right:0; bottom:0; left:0; background:rgba(13,12,10,0.16); opacity:0; pointer-events:none; transition:opacity var(--dur-slow) var(--ease); z-index:35; }
#sidePanelScrim.open { opacity:1; pointer-events:auto; }
#sidePanel { position:fixed; top:calc(36px + env(safe-area-inset-top)); right:0; bottom:0; width:min(244px, 80vw); background:var(--chrome); border-left:1px solid var(--border-strong); display:flex; flex-direction:column; transform:translateX(100%); transition:transform var(--dur-slow) var(--ease); z-index:40; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); }
#sidePanel.open { transform:translateX(0); }
#panelTabs { display:flex; border-bottom:1px solid var(--border-strong); flex-shrink:0; }
#panelTabs button { appearance:none; border:0; background:transparent; color:var(--fg); flex:1; height:30px; font:inherit; font-weight:700; font-size:9px; letter-spacing:0; cursor:pointer; border-bottom:2px solid transparent; }
#panelTabs button.active { background:var(--chrome-light); border-bottom-color:var(--accent-core); }
#panelBody { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
.tab-panel { display:none; padding:var(--s-2); }
.tab-panel.active { display:block; }

#statusBar { flex-shrink: 0; height: calc(20px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-2); padding-bottom: env(safe-area-inset-bottom); background: var(--chrome); border-top: 1px solid var(--border-strong); font-size: 10px; color: var(--fg); box-shadow: inset 0 1px 0 var(--chrome-light); }

#menuOverlay { position:fixed; inset:0; z-index:80; background:rgba(13,12,10,0.46); display:none; }
#menuOverlay.open { display:block; }
#menuSheet { position:fixed; left:50%; right:auto; bottom:0; z-index:90; width:min(380px, calc(100vw - 20px)); max-height:70dvh; overflow-y:auto; background:var(--bg); border:2px solid var(--border-strong); border-bottom:0; box-shadow:4px 4px 0 rgba(0,0,0,0.18); transform:translate(-50%, 100%); transition:transform var(--dur-slow) var(--ease); padding-bottom:env(safe-area-inset-bottom); }
#menuSheet.open { transform:translate(-50%, 0); }
.menu-head { padding:6px 8px; font-size:10px; letter-spacing:0.18em; font-weight:700; font-family: 'Silkscreen', ui-monospace; text-transform:uppercase; border-bottom:1px solid var(--border-strong); background:var(--chrome); display:flex; justify-content:space-between; align-items:center; }
.menu-head button { height:24px; min-width:24px; padding:0 var(--s-1); font-size:10px; background:var(--chrome-light); color:var(--fg); border:1px solid var(--border-strong); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-family:inherit; }
.menu-x { line-height:1; }
.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; }
.menu-card { appearance:none; min-height:48px; padding:6px 8px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; text-align:left; cursor:pointer; }
.menu-card.danger { border-color:#8f3b32; box-shadow:2px 2px 0 #8f3b32; }
.menu-card.danger .menu-label { color:#8f3b32; }
.menu-label { font-size:10px; font-weight:700; letter-spacing:0.04em; }
.menu-meta { font-size:8px; letter-spacing:0.08em; color:var(--fg-muted); }

#toast { position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(4px); background:var(--bg-active); color:var(--fg-inv); padding:10px 14px; font-size:10px; letter-spacing:0.18em; font-weight:700; opacity:0; pointer-events:none; transition:opacity var(--dur-base), transform var(--dur-base); z-index:700; white-space:nowrap; border-left:3px solid var(--accent-core); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ============================================================
   COMPOSITOR SPECIFIC OVERRIDES & BEVELS
   ============================================================ */
.cmp-sec { font-size: 9px; letter-spacing: 0.18em; font-weight: 700; color: var(--fg-muted); text-transform: uppercase; margin: var(--s-2) 0 4px; }
.cmp-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
.cmp-label { flex: 0 0 62px; font-size: 9px; letter-spacing: 0.1em; font-weight: 700; color: var(--fg-muted); text-transform: uppercase; }
.cmp-val { flex: 0 0 32px; text-align: right; font-size: 9px; color: var(--fg-muted); font-weight: 700; }
input[type="color"].cmp-color { -webkit-appearance: none; appearance: none; width: 32px; height: 22px; padding: 0; flex: 0 0 32px; border: 2px solid var(--border-strong); box-shadow: inset 1px 1px 0 rgba(0,0,0,0.1); background: transparent; cursor: pointer; }
input[type="color"].cmp-color::-webkit-color-swatch-wrapper { padding: 2px; }
input[type="color"].cmp-color::-webkit-color-swatch { border: none; }
.cmp-hex { background: none; border: 1px solid var(--border-soft); color: var(--fg); font: inherit; font-size: 9px; padding: 3px 5px; cursor: pointer; min-width: 56px; }
.cmp-range { flex: 1; -webkit-appearance: none; appearance: none; height: 20px; background: transparent; margin: 0; }
.cmp-range::-webkit-slider-runnable-track { height: 4px; background: var(--chrome-dark); border: 1px solid var(--border-strong); }
.cmp-range::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 14px; background: var(--fg); border: 1px solid var(--border-strong); margin-top: -5px; }
.cmp-select, .cmp-num { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); font: inherit; font-size: 9px; padding: 4px 5px; }
.cmp-text { width: 100%; min-height: 60px; resize: vertical; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); font: inherit; font-size: 10px; padding: 5px; margin-bottom: var(--s-2); }
.cmp-btn { appearance: none; border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); font: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 8px; cursor: pointer; width: 100%; margin-bottom: 6px; }
.cmp-btn:hover { background: var(--bg-hover); }
.cmp-btn:active { background: var(--bg-active); color: var(--fg-inv); }
.cmp-hint { font-size: 9px; line-height: 1.6; color: var(--fg-muted); margin: 8px 0 var(--s-1); }
.cmp-meta { font-size: 9px; font-weight: 700; color: var(--fg-muted); margin: 2px 0 8px; }

.layer-row { display: flex; align-items: center; gap: 5px; padding: 4px 6px; margin: var(--s-1) 0; border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); cursor: pointer; font-size: 9px; }
.layer-row.selected { background: var(--bg-active); color: var(--fg-inv); }
.layer-icon { flex: 0 0 12px; }
.layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-btn { border: 1px solid var(--border-strong); background: transparent; color: inherit; font-size: 9px; padding: 1px 4px; cursor: pointer; }
.layer-btn.del { font-size: 11px; padding: 1px 4px; }
.layer-row .layer-btn:disabled, .layer-row .layer-btn.disabled, .layer-row.disabled { opacity: 0.3; pointer-events: none; }

/* Button typography. Visual Win95 bevels live in the final theme pass. */
.top-btn, .t-btn, .p-btn, .menu-card, .menu-head button, .cmp-btn, .studio-btn, .studio-x {
  font-family: 'Silkscreen', 'VT323', monospace;
  text-transform: uppercase;
  border-radius: 0;
}

.top-btn.cmp-btn[disabled] { opacity: 0.25; pointer-events: none; }

/* Specific button sizing */
.cmp-btn { padding: 6px 8px; font-size: 10px; line-height: 1.2; margin-bottom: 6px; width: 100%; display: block; text-align: center; }
.top-btn.cmp-btn { width: auto; height: 30px; min-width: 32px; min-height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0; padding: 0 6px; font-size: 10px; letter-spacing: 0.04em; white-space: nowrap; }
.t-btn { width: 44px; height: 44px; margin: 2px auto; display: flex; align-items: center; justify-content: center; }

/* Inputs */
.cmp-hex, .cmp-select, .cmp-num, .cmp-text, input[type="color"] {
  border: 2px solid var(--border-strong);
  box-shadow: inset 1px 1px 0 rgba(0,0,0,0.1);
  font-family: 'Silkscreen', monospace;
  font-size: 10px;
  padding: 4px 6px;
}

/* BACKGROUND STUDIO */
#bgStudio { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(13,12,10,0.58); }
#bgStudio.open { display: flex; }
.studio-panel { width: min(720px, 100%); max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: flex; flex-direction: column; background: var(--bg); border: 2px solid var(--border-strong); box-shadow: 6px 6px 0 rgba(0,0,0,0.22), 0 18px 50px rgba(0,0,0,0.3); }
.studio-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 9px; background: var(--chrome); border-bottom: 2px solid var(--border-strong); font-family: 'Silkscreen', ui-monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.studio-x { width: 26px; height: 26px; padding: 0; font-size: 12px; line-height: 1; background: var(--chrome-light); color: var(--fg); border: 2px solid var(--border-strong); box-shadow: 1px 1px 0 var(--border-strong); cursor: pointer; font-family: inherit; }
.studio-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: hidden; }
.studio-preview-wrap { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; border: 2px solid var(--border-strong); background: var(--chrome); box-shadow: inset 1px 1px 0 var(--chrome-light); }
#bgPreview { display: block; max-width: 100%; max-height: min(26dvh, 220px); width: auto; height: auto; border: 2px solid var(--border-strong); box-shadow: 2px 2px 0 var(--border-strong); image-rendering: auto; }
.studio-meta { font-size: 9px; letter-spacing: 0.1em; color: var(--fg-muted); font-weight: 700; }
.studio-presets { flex-shrink: 0; display: flex; gap: 5px; overflow-x: auto; overflow-y: hidden; padding: 2px 1px 4px; scrollbar-width: none; }
.studio-presets::-webkit-scrollbar { display: none; }
.studio-preset { appearance: none; flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; min-height: 54px; padding: 3px 2px; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); box-shadow: 1px 1px 0 var(--border-strong); cursor: pointer; font-family: inherit; }
.studio-preset canvas { display: block; width: auto; height: auto; max-width: 50px; max-height: 34px; min-width: 8px; min-height: 8px; border: 1px solid var(--border-strong); background: var(--chrome); }
.studio-preset span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8px; line-height: 1.1; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
.studio-preset:hover { background: var(--bg-hover); }
.studio-preset.active { background: var(--bg-active); color: var(--fg-inv); border-color: var(--accent-core); box-shadow: 0 0 0 1px var(--accent-core); }
.studio-preset.active canvas { border-color: var(--accent-core); }
.studio-tabs { flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding-bottom: 6px; border-bottom: 2px solid var(--border-strong); }
.studio-tab { appearance: none; display: flex; align-items: center; justify-content: center; min-height: 34px; padding: 6px 2px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); font-family: 'Silkscreen', ui-monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; box-shadow: 1px 1px 0 var(--border-strong); }
.studio-tab:hover { background: var(--bg-hover); }
.studio-tab.active { background: var(--accent-core); color: var(--fg-inv); box-shadow: inset 1px 1px 0 rgba(0,0,0,0.2); }
.studio-tab-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 2px 8px; scrollbar-width: thin; }
.studio-palette-row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.studio-palette { appearance: none; flex: 1 1 64px; display: flex; height: 34px; padding: 2px; gap: 2px; border: 1px solid var(--border-strong); background: var(--bg); box-shadow: 1px 1px 0 var(--border-strong); cursor: pointer; }
.studio-palette span { flex: 1; }
.studio-palette:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--border-strong); }
.studio-inline { display: flex; gap: 5px; margin: 4px 0 8px; }
.studio-inline .studio-btn { flex: 1; }
.studio-actions { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border-top: 2px solid var(--border-strong); background: var(--chrome); }
.studio-spacer { flex: 1; }
.studio-btn { appearance: none; min-height: 34px; cursor: pointer; padding: 8px 10px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.studio-btn.active { background: var(--bg-active); color: var(--fg-inv); }
.studio-btn[disabled] { opacity: 0.45; pointer-events: none; }
.studio-size-x { flex: 0 0 auto; font-size: 9px; color: var(--fg-muted); }
.studio-note { font-size: 9px; line-height: 1.55; color: var(--fg-muted); margin: 6px 0; }
@media (max-width: 440px) {
  #bgStudio { padding: 0; }
  .studio-panel { width: 100%; height: 100dvh; max-height: none; border-left: 0; border-right: 0; border-top: 0; border-bottom: 0; box-shadow: none; }
  .studio-head { padding-top: calc(7px + env(safe-area-inset-top)); }
  .studio-actions { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .studio-body { padding: 6px; gap: 5px; }
  #bgPreview { max-height: 20dvh; }
  .studio-preset { flex-basis: 52px; min-height: 48px; }
  .studio-preset canvas { max-width: 44px; max-height: 29px; }
  .studio-tab { padding: 6px 1px; font-size: 8px; }
  .studio-actions .studio-btn { flex: 1; min-width: 60px; }
  .studio-actions .studio-spacer { display: none; }
}

/* COLOR PICKER */
.cp-overlay { position: fixed; inset: 0; z-index: 600; background: rgba(13, 12, 10, 0.6); display: flex; align-items: center; justify-content: center; padding: var(--s-4); }
.cp-panel { width: min(292px, 94vw); background: var(--bg); border: 1px solid var(--border-strong); box-shadow: inset 1px 1px 0 var(--chrome-light), inset -1px -1px 0 var(--chrome-dark), 0 12px 40px rgba(0,0,0,0.5); }
.cp-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px; border-bottom: 1px solid var(--border-strong); background: var(--chrome); font-weight: 700; font-size: 10px; text-transform: uppercase; }
.cp-x { border: 1px solid var(--border-strong); background: transparent; cursor: pointer; width: 20px; height: 20px; font-size: 10px; }
.cp-body { padding: var(--s-2); }
.cp-sv { display: block; width: 100%; height: auto; image-rendering: pixelated; box-shadow: inset 1px 1px 0 rgba(0,0,0,0.35), 0 0 0 1px var(--border-strong); touch-action: none; cursor: crosshair; }
.cp-hue-wrap { margin-top: var(--s-2); }
.cp-hue { display: block; width: 100%; height: 12px; box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; }
.cp-row { display: flex; align-items: center; gap: 6px; margin-top: var(--s-2); }
.cp-prev { position: relative; flex: 0 0 30px; height: 30px; border: 1px solid var(--border-strong); background-image: conic-gradient(#c8c8c8 25%, #ffffff 0 50%, #c8c8c8 0 75%, #ffffff 0); background-size: 8px 8px; }
.cp-prev-alpha, .cp-prev-solid { position: absolute; inset: 0; }
.cp-prev-solid { clip-path: polygon(0 0, 100% 0, 0 100%); }
.cp-hex { flex: 1; height: 30px; border: 1px solid var(--border-strong); padding: 0 var(--s-2); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.cp-alpha-row { display: flex; align-items: center; gap: 6px; margin-top: var(--s-2); }
.cp-alpha { flex: 1; height: 18px; cursor: pointer; }
.cp-alpha-lbl { flex: 0 0 auto; font-size: 10px; font-weight: 700; }
.cp-alpha-num { flex: 0 0 30px; text-align: right; font-size: 10px; font-weight: 700; color: var(--fg-muted); }
.cp-swatches { display: flex; flex-wrap: wrap; gap: 3px; margin-top: var(--s-2); max-height: 66px; overflow-y: auto; }
.cp-swatch { width: 20px; height: 20px; border: 1px solid var(--border-strong); cursor: pointer; }
.cp-actions { display: flex; gap: 6px; margin-top: 10px; }
.cp-actions .p-btn { flex: 1; height: 30px; font-size: 9px; letter-spacing: 0.1em; }
.p-btn { appearance:none; color:var(--fg); padding:0 6px; height:28px; font:inherit; font-weight:700; font-size:9px; cursor:pointer; text-transform: uppercase; }
.p-btn.active { background: var(--bg-active); color: var(--fg-inv); }
.cmp-seg { display: flex; flex: 1; gap: var(--s-1); min-width: 0; }
.cmp-seg .p-btn { flex: 1; min-width: 0; padding: 0 3px; }

/* INLINE TEXT EDITOR */
#compTextEditor { position: fixed; display: none; z-index: 75; background: rgba(20,20,20,0.95); border: 1px solid var(--border-strong); padding: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
#compTextEditor.open { display: flex; flex-direction: column; }
#compTextEditor textarea { background: transparent; color: #fff; border: 0; font: inherit; font-size: 18px; min-width: 180px; min-height: 60px; outline: none; resize: both; padding: 4px; }

/* COMPACT TOUCH TARGETS */
.top-btn.cmp-btn { position: relative; }
.top-btn.cmp-btn::after { content: ''; position: absolute; inset: -3px -2px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent-core);
  outline-offset: 2px;
}
@media (max-width: 380px) {
  #topbar { gap: 2px; padding-left: 2px; padding-right: 2px; }
  .top-btn.cmp-btn { padding: 0 5px; font-size: 9px; }
  .top-btn.cmp-btn::after { inset: -3px; }
}

/* ============================================================
   CLASSIC PAINT THEME — Win95-era grey chrome, sunken fields,
   raised bevels, blue title bars, and a Paint colour tray.
   ============================================================ */
:root {
  --chrome: #c0c0c0;
  --chrome-light: #ffffff;
  --chrome-dark: #808080;
  --bg: #c0c0c0;
  --bg-hover: #d4d0c8;
  --bg-active: #000080;
  --fg: #000000;
  --fg-muted: #6a6358;
  --fg-inv: #ffffff;
  --border-strong: #000000;
  --border-soft: #808080;
  --border-hair: #dfdfdf;
  --accent-core: #5a6ea8;

  --bevel-raised: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080, inset 2px 2px 0 #dfdfdf, inset -2px -2px 0 #404040;

html, body { background: #008080; }
#app { border: 1px solid #000000; background: var(--chrome); box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080; }

#panelTabs { padding: 3px 3px 0; gap: 2px; background: var(--chrome); border-bottom: 1px solid #000000; }

#panelBody { background: var(--chrome); }

#statusBar { gap: 3px; padding-left: 4px; padding-right: 4px; border-top: 1px solid #000000; box-shadow: inset 0 1px 0 #ffffff; }
#statusBar span { flex: 0 0 auto; padding: 1px 5px; border: 1px solid #808080; border-top-color: #808080; border-left-color: #808080; border-right-color: #ffffff; border-bottom-color: #ffffff; background: var(--chrome); font-size: 9px; letter-spacing: 0.06em; line-height: 1.2; }

.cmp-hex { background: var(--chrome); color: #000000; border: 1px solid #000000; box-shadow: var(--bevel-raised); }
.cmp-hex:active { box-shadow: var(--bevel-sunken); transform: translate(1px, 1px); }
.cmp-range, .cp-alpha { -webkit-appearance: none; appearance: none; height: 20px; background: transparent; }
.cmp-range::-webkit-slider-runnable-track, .cp-alpha::-webkit-slider-runnable-track { height: 6px; background: var(--chrome); border: 1px solid #000000; box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #ffffff; }
.cmp-range::-webkit-slider-thumb, .cp-alpha::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 18px; margin-top: -7px; background: var(--chrome); border: 1px solid #000000; box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080; }

/* ============================================================
   WIN95 / WIN98 / Y2K FINAL PASS
   ============================================================ */

.top-btn:hover, .t-btn:hover, .p-btn:hover, .menu-head button:hover, .cmp-btn:hover,

}

.t-btn.active, .t-btn.active:hover {

  transform: translate(1px, 1px);

/* Window-manager chrome and classic document fields. */
#topbar {
  box-sizing: border-box;
  height: calc(36px + env(safe-area-inset-top));

// ============================================================
//  COLOR PICKER LOGIC

function _rgb2hex(r, g, b) { const c = (v) => ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2); return '#' + c(r) + c(g) + c(b); }
function _hex2rgb(hex) { hex = String(hex || '#000000').replace(/^#/, ''); if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; if (hex.length !== 6) return [0, 0, 0]; return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)]; }
function _normHex(hex) { hex = String(hex || '').replace(/[^0-9a-fA-F]/g, ''); if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; if (hex.length !== 6) return '#000000'; return '#' + hex.toLowerCase(); }
function _hex2hsv(hex) { const [r, g, b] = _hex2rgb(hex); const rr = r / 255, gg = g / 255, bb = b / 255; const mx = Math.max(rr, gg, bb), mn = Math.min(rr, gg, bb); const d = mx - mn; let h = 0; if (d !== 0) { if (mx === rr) h = ((gg - bb) / d) % 6; else if (mx === gg) h = (bb - rr) / d + 2; else h = (rr - gg) / d + 4; h *= 60; if (h < 0) h += 360; } const v = mx; const s = mx === 0 ? 0 : d / mx; return { h, s, v }; }
function _hsv2hex(h, s, v) { h = ((h % 360) + 360) % 360; const c = v * s; const x = c * (1 - Math.abs(((h / 60) % 2) - 1)); let r = 0, g = 0, b = 0; if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; } else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; } else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; } const m = v - c; return _rgb2hex((r + m) * 255, (g + m) * 255, (b + m) * 255); }

// The familiar 28-colour Paint palette, used as a quick tray in every picker.

function updateBgPreview() {
  if (!bgStudioDraft || !elBgPreview) return;
  const w = clamp(Math.round(bgStudioDraft.width) || 1080, 16, 8000);
  const h = clamp(Math.round(bgStudioDraft.height) || 1080, 16, 8000);
  const ratio = w / h;
  const heavy = bgStudioDraft.type === 'noise' || bgStudioDraft.type === 'static';
  const maxDim = heavy ? 420 : 640;
  let pw, ph;
  if (ratio >= 1) { pw = maxDim; ph = Math.round(maxDim / ratio); }
  else { ph = maxDim; pw = Math.round(maxDim * ratio); }
  pw = Math.max(2, pw); ph = Math.max(2, ph);
  if (elBgPreview.width !== pw) elBgPreview.width = pw;
  if (elBgPreview.height !== ph) elBgPreview.height = ph;
  const c = elBgPreview.getContext('2d');
  if (c) {
    const factor = Math.min(pw / w, ph / h);
    const previewRecipe = Object.assign({}, bgStudioDraft, {
      scale: Math.max(1, (bgStudioDraft.scale || 48) * factor),
      thickness: Math.max(0.4, (bgStudioDraft.thickness || 6) * factor),
      _previewFactor: factor
    });
    renderBackgroundRecipe(c, pw, ph, previewRecipe);
  }
  if (elBgMeta) elBgMeta.textContent = w + ' × ' + h + ' · ' + bgTypeLabel(bgStudioDraft.type);
}

function scheduleBgPreview() {
  if (bgPreviewRaf) return;
  bgPreviewRaf = requestAnimationFrame(() => { bgPreviewRaf = 0; updateBgPreview(); });
}

function bgMarkCustom() {

function applyBgPreset(preset) {
  if (!bgStudioDraft || !preset) return;
  const base = defaultBgRecipe();
  for (const key of Object.keys(base)) bgStudioDraft[key] = base[key];
  for (const key of Object.keys(preset.recipe)) bgStudioDraft[key] = preset.recipe[key];
  bgStudioDraft.presetId = preset.id;
  bgActivePresetId = preset.id;

function buildBgPresetStrip() {
  if (!elBgPresets || !bgStudioDraft) return;
  elBgPresets.innerHTML = '';
  const docW = clamp(Math.round(bgStudioDraft.width) || 1080, 16, 8000);
  const docH = clamp(Math.round(bgStudioDraft.height) || 1080, 16, 8000);
  const ratio = docW / docH;
  const thumbW = ratio >= 1 ? 72 : Math.max(20, Math.round(52 * ratio));
  const thumbH = ratio >= 1 ? Math.max(18, Math.round(72 / ratio)) : 52;
  for (const preset of BG_STUDIO_PRESETS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'studio-preset' + (preset.id === bgActivePresetId ? ' active' : '');
    button.dataset.preset = preset.id;
    button.title = preset.name;
    button.setAttribute('aria-pressed', preset.id === bgActivePresetId ? 'true' : 'false');
    const preview = document.createElement('canvas');
    preview.width = thumbW; preview.height = thumbH;
    const pc = preview.getContext('2d');
    if (pc) {
      const factor = Math.min(thumbW / docW, thumbH / docH);
      const thumbRecipe = Object.assign({}, preset.recipe, {
        scale: Math.max(1, preset.recipe.scale * factor),
        thickness: Math.max(0.4, preset.recipe.thickness * factor),
        _previewFactor: factor
      });
      try { renderBackgroundRecipe(pc, thumbW, thumbH, thumbRecipe); } catch (_) {}
    }
    const label = document.createElement('span');
    label.textContent = preset.name;

function openBackgroundStudio() {

function closeBackgroundStudio() {

function randomizeBackgroundDraft() {
  if (!bgStudioDraft) return;
  const palette = BG_RANDOM_PALETTES[Math.floor(Math.random() * BG_RANDOM_PALETTES.length)];
  const types = BG_TYPE_OPTIONS.map((item) => item[0]);
  bgStudioDraft.type = types[Math.floor(Math.random() * types.length)];
  bgStudioDraft.c1 = palette[0];
  bgStudioDraft.c2 = palette[1];
  bgStudioDraft.c3 = palette[2];
  bgStudioDraft.angle = Math.floor(Math.random() * 360);
  bgStudioDraft.scale = Math.floor(24 + Math.random() * 116);
  bgStudioDraft.thickness = Math.floor(1 + Math.random() * 24);
  bgStudioDraft.grain = Math.floor(Math.random() * 34);
  bgStudioDraft.grainSize = [0.5, 1, 1.5, 2, 3][Math.floor(Math.random() * 5)];
  bgStudioDraft.scanlines = [0, 0, 0, 12, 25, 40][Math.floor(Math.random() * 6)];
  bgStudioDraft.vignette = Math.floor(Math.random() * 42);
  bgStudioDraft.brightness = Math.floor(Math.random() * 25) - 8;
  bgStudioDraft.contrast = Math.floor(Math.random() * 36) - 10;
  bgStudioDraft.saturation = Math.floor(Math.random() * 46) - 16;
  bgStudioDraft.hue = [0, 0, 0, 0, 30, 90, 180, 270][Math.floor(Math.random() * 8)];
  bgStudioDraft.blur = Math.random() < 0.8 ? 0 : Math.round(Math.random() * 20) / 10;
  bgStudioDraft.tint = palette[Math.floor(Math.random() * palette.length)];
  bgStudioDraft.tintOpacity = Math.floor(Math.random() * 16);
  bgStudioDraft.seed = (Math.random() * 0xffffffff) >>> 0;
  delete bgStudioDraft.presetId;
  bgActivePresetId = null;
  bgStudioTab = 'pattern';
  buildBgStudioTabs();
  buildBgStudioControls();
  if (elBgControls) elBgControls.scrollTop = 0;
  syncBgPresetButtons();
  updateBgPreview();
}

async function applyBackgroundStudio() {
  if (!bgStudioDraft || bgApplying) return;
  const token = ++bgApplyToken;
  const draft = JSON.parse(JSON.stringify(bgStudioDraft));
  const w = clamp(Math.round(draft.width) || state.width, 16, 8000);
  const h = clamp(Math.round(draft.height) || state.height, 16, 8000);
  bgApplying = true;
  const applyLabel = elBgApply ? elBgApply.textContent : '';
  if (elBgApply) { elBgApply.disabled = true; elBgApply.textContent = 'Working...'; }
  try {
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const octx = out.getContext('2d');
    if (!octx) { showToast('BACKGROUND FAILED'); return; }
    renderBackgroundRecipe(octx, w, h, draft);
    let url;
    try { url = out.toDataURL('image/png'); } catch (_) { showToast('BACKGROUND TOO LARGE'); return; }
    const img = await decodeImage(url);
    if (token !== bgApplyToken) return;
    if (!img) { showToast('BACKGROUND FAILED'); return; }
    delete draft.width; delete draft.height;
    beginChange();
    state.backgroundRecipe = draft;
    state.backgroundUrl = url;
    state.backgroundImage = img;
    imageCache.set(url, img);
    state.width = w;
    state.height = h;
    state.backgroundOpacity = 100;
    state.backgroundColor = normHex(draft.c1);
    commitChange();
    closeBackgroundStudio();
    fitToView();
    buildProperties();
    requestRender();
    showToast('BACKGROUND APPLIED');
  } finally {
    bgApplying = false;
    if (elBgApply) { elBgApply.disabled = false; elBgApply.textContent = applyLabel; }
  }
}

// Floating Text Editor Implementation
let activeTextLayerIdx = -1;
let activeTextIsFresh = false;
let activeTextboxDirty = false;
let activeTextOriginalText = '';
let activeTextStartHeight = 0;

function syncTextboxEditorHeight(el, preserveHeight) {
  if (!el || el.type !== 'textbox') return;
  const zoom = state.zoom || 1;
  elTextInput.style.height = 'auto';
  const scrollH = elTextInput.scrollHeight || 0;
  const canvasH = textboxContentHeight(el) * zoom;
  const minH = Math.max(60, preserveHeight ? (activeTextStartHeight || 0) : 0) * zoom;
  const nextH = Math.max(minH, scrollH, canvasH);
  el.height = Math.max(20, nextH / zoom);
  elTextInput.style.height = nextH + 'px';
  elTextEditor.style.height = nextH + 'px';
}

function openTextEditor(idx, opts) {
  let target = state.elements[idx];
  if (!target || (target.type !== 'text' && target.type !== 'textbox')) return;
  const freshRequested = target.type === 'textbox' && !!(opts && opts.fresh);
  if (freshRequested && freshTextbox && freshTextbox !== target) return;
  if (elTextEditor.classList.contains('open')) {
    closeTextEditor();
    idx = state.elements.indexOf(target);
    target = state.elements[idx];
    if (!target) return;
  }
  const el = target;
  const isTextbox = el.type === 'textbox';
  const fresh = isTextbox && !!(opts && opts.fresh);
  activeTextLayerIdx = idx;
  activeTextIsFresh = fresh;
  activeTextboxDirty = false;
  activeTextOriginalText = isTextbox ? String(el.text == null ? '' : el.text) : '';
  activeTextStartHeight = isTextbox ? (el.height || 60) : 0;

  const p = docToScreen(el.x, el.y);
  const rect = canvas.getBoundingClientRect();
  const zoom = state.zoom || 1;
  const pad = (el.padding == null ? 16 : el.padding) * zoom;
  const editorW = isTextbox ? Math.max(40, el.width * zoom) : Math.max(80, el.width * zoom);
  const editorH = isTextbox ? Math.max(24, el.height * zoom) : Math.max(60, el.height * zoom);
  let bg = 'transparent';
  if (el.bgColor && String(el.bgColor).toLowerCase() !== 'transparent') {
    if (isTextbox) bg = el.bgColor;
    else {
      const c = parseCssColor(el.bgColor);
      bg = colorToCss(c.hex, c.alpha * ((el.bgOpacity == null ? 100 : el.bgOpacity) / 100));
    }
  }
  elTextEditor.style.left = (rect.left + p.x) + 'px';
  elTextEditor.style.top = (rect.top + p.y) + 'px';
  elTextEditor.style.width = editorW + 'px';
  elTextEditor.style.height = editorH + 'px';
  elTextEditor.style.padding = '0';
  elTextEditor.style.background = 'transparent';
  elTextEditor.style.border = isTextbox ? 'none' : '1px solid var(--border-strong)';
  elTextEditor.style.boxShadow = isTextbox ? 'none' : '0 4px 20px rgba(0,0,0,0.5)';
  elTextEditor.style.overflow = isTextbox ? 'visible' : '';
  elTextEditor.classList.add('open');
  editingTextEl = el;
  requestRender();
  elTextInput.setAttribute('aria-label', isTextbox ? 'Edit smart text box' : 'Edit text');
  elTextInput.value = el.text == null ? '' : el.text;
  elTextInput.style.width = '100%';
  elTextInput.style.height = '100%';
  elTextInput.style.minWidth = '0';
  elTextInput.style.minHeight = '0';
  elTextInput.style.padding = pad + 'px';
  elTextInput.style.background = bg;
  elTextInput.style.color = el.color || '#fbfbfa';
  elTextInput.style.fontFamily = el.font;
  elTextInput.style.fontSize = ((el.size || 18) * zoom) + 'px';
  elTextInput.style.fontWeight = String(el.weight || 400);
  elTextInput.style.lineHeight = String(el.lineHeight || 1.4);
  elTextInput.style.textAlign = el.textAlign || 'left';
  elTextInput.style.border = 'none';
  elTextInput.style.outline = 'none';
  elTextInput.style.resize = 'none';
  elTextInput.style.boxSizing = 'border-box';
  elTextInput.style.overflow = isTextbox ? 'hidden' : '';
  elTextInput.style.overflowWrap = isTextbox ? 'anywhere' : '';
  elTextInput.style.wordBreak = isTextbox ? 'break-word' : '';

  if (isTextbox) {
    elTextInput.style.height = 'auto';
    syncTextboxEditorHeight(el, true);
  }

}

function closeTextEditor() {
  if (!elTextEditor.classList.contains('open')) return;
  const idx = activeTextLayerIdx;
  const el = state.elements[idx];
  if (el && el.type === 'text') {
    if (el.text !== elTextInput.value) {
      beginChange();
      el.text = elTextInput.value;
      measureTextElement(el);
      commitChange();
      buildProperties();
    }
  } else if (el && el.type === 'textbox') {
    if (el.text !== elTextInput.value) el.text = elTextInput.value;
    const text = String(el.text == null ? '' : el.text);
    const empty = text.trim() === '';
    const heightChanged = Math.abs((el.height || 0) - activeTextStartHeight) > 0.01;
    const edited = activeTextIsFresh || activeTextboxDirty || text !== activeTextOriginalText || heightChanged;
    if (empty && edited) {
      state.elements.splice(idx, 1);
      if (state.selectedIndex === idx) state.selectedIndex = -1;
      else if (state.selectedIndex > idx) state.selectedIndex -= 1;
      if (activeTextIsFresh) {
        pending = null;
        updateUndoButtons();
      } else {
        commitChange();
      }
      buildProperties();
      updateStatus();
      requestRender();
    } else if (edited) {
      const netChanged = activeTextIsFresh || text !== activeTextOriginalText || heightChanged;
      if (netChanged) commitChange();
      else if (pending) { pending = null; updateUndoButtons(); }
      buildProperties();
    }
  } else if (activeTextIsFresh && pending) {
    pending = null;
    updateUndoButtons();
  }
  elTextEditor.classList.remove('open');
  elTextEditor.style.border = '';
  elTextEditor.style.boxShadow = '';
  elTextEditor.style.height = '';
  elTextEditor.style.overflow = '';
  elTextInput.style.height = '';
  elTextInput.style.overflow = '';
  elTextInput.style.overflowWrap = '';
  elTextInput.style.wordBreak = '';
  elTextInput.style.borderRadius = '';
  if (activeTextIsFresh) freshTextbox = null;
  editingTextEl = null;
  activeTextLayerIdx = -1;
  activeTextIsFresh = false;
  activeTextboxDirty = false;
  activeTextOriginalText = '';
  activeTextStartHeight = 0;
  requestRender();
}
elTextInput.addEventListener('blur', closeTextEditor);
elTextInput.addEventListener('input', () => {
  if (!elTextEditor.classList.contains('open')) return;
  const el = state.elements[activeTextLayerIdx];
  if (!el || el.type !== 'textbox') return;

  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); elTextInput.blur(); }

  const p = canvasPoint(e); const doc = screenToDoc(p.x, p.y); const idx = hitTest(doc.x, doc.y);

    titleIn.addEventListener('input', () => { beginChange(); el.title = titleIn.value; requestRender(); });

    titleRow.appendChild(titleIn);
    addSelectRow(row(), 'Font', el.font, FONT_FAMILIES, (v) => { el.font = v; requestRender(); });
    addNumberRow(row(), 'Size', el.size, 4, 200, (v) => { el.size = v; requestRender(); });
    addRangeRow(row(), 'Line height', el.lineHeight, 1, 2, 0.05, (v) => { el.lineHeight = v; requestRender(); }, (v) => v.toFixed(2));
    addColorRow(row(), 'Title text', el.titleColor, (color) => { el.titleColor = color; requestRender(); });
    addColorRow(row(), 'Title BG', el.titleBg, (color) => { el.titleBg = color; requestRender(); });
    addColorRow(row(), 'Window BG', el.bgColor, (color) => { el.bgColor = color; requestRender(); });
    addColorRow(row(), 'Border', el.borderColor, (color) => { el.borderColor = color; requestRender(); });
    addColorRow(row(), 'Text', el.textColor, (color) => { el.textColor = color; requestRender(); });
    addRangeRow(row(), 'Opacity', el.opacity == null ? 100 : el.opacity, 0, 100, 1, (v) => { el.opacity = v; requestRender(); }, (v) => v + '%');
    const hint = document.createElement('div'); hint.className = 'cmp-hint'; hint.textContent = 'WINDOW CHROME STAYS FIXED WHEN RESIZED.'; elProps.appendChild(hint);
  } else if (el.type === 'image') {
    const hint = document.createElement('div'); hint.className = 'cmp-hint'; hint.textContent = 'IMAGES KEEP THEIR ORIGINAL ASPECT RATIO WHEN RESIZED.'; elProps.appendChild(hint);
    addRangeRow(row(), 'Opacity', el.opacity, 0, 100, 1, (v) => { el.opacity = v; requestRender(); }, (v) => v + '%');
  }
  sec('ACTIONS');
  const del = document.createElement('button'); del.type = 'button'; del.className = 'cmp-btn'; del.textContent = 'Delete layer'; del.addEventListener('click', deleteSelected); elProps.appendChild(del);
}

function buildBackgroundProps() {
  sec('CANVAS BACKGROUND');
  addColorRow(row(), 'Color', state.backgroundColor, (color) => { state.backgroundColor = color; requestRender(); });
  const studioBtn = document.createElement('button'); studioBtn.type = 'button'; studioBtn.className = 'cmp-btn'; studioBtn.textContent = 'Background studio'; studioBtn.addEventListener('click', openBackgroundStudio); elProps.appendChild(studioBtn);
  const bgBtn = document.createElement('button'); bgBtn.type = 'button'; bgBtn.className = 'cmp-btn'; bgBtn.textContent = state.backgroundImage ? 'Replace background image' : 'Load background image'; bgBtn.addEventListener('click', () => elBgFile.click()); elProps.appendChild(bgBtn);
  if (state.backgroundImage) {
    const clr = document.createElement('button'); clr.type = 'button'; clr.className = 'cmp-btn'; clr.style.marginTop = '6px'; clr.textContent = 'Remove background'; clr.addEventListener('click', () => { beginChange(); state.backgroundImage = null; state.backgroundUrl = null; state.backgroundRecipe = null; commitChange(); buildProperties(); requestRender(); showToast('BACKGROUND REMOVED'); }); elProps.appendChild(clr);
    addRangeRow(row(), 'Opacity', state.backgroundOpacity, 0, 100, 1, (v) => { state.backgroundOpacity = v; requestRender(); }, (v) => v + '%');
    const fitHint = document.createElement('div'); fitHint.className = 'cmp-hint'; fitHint.textContent = 'IMAGE BACKGROUNDS KEEP THEIR RATIO AND FILL THE CANVAS.'; elProps.appendChild(fitHint);
  }
  sec('DOCUMENT');
  addNumberRow(row(), 'Width', state.width, 16, 8000, (v) => { state.width = v; requestRender(); });
  addNumberRow(row(), 'Height', state.height, 16, 8000, (v) => { state.height = v; requestRender(); });
  const hint = document.createElement('div'); hint.className = 'cmp-hint'; hint.textContent = 'NO LAYER SELECTED. PICK A TOOL AND DRAG ON THE CANVAS TO ADD A LAYER.'; elProps.appendChild(hint);
}

function buildLayersList() {
  if (!elLayers) return;
  elLayers.innerHTML = '';
  const secTitle = document.createElement('div'); secTitle.className = 'cmp-sec'; secTitle.textContent = 'LAYERS'; elLayers.appendChild(secTitle);
  if (state.elements.length === 0) { const hint = document.createElement('div'); hint.className = 'cmp-hint'; hint.textContent = 'NO LAYERS YET.'; elLayers.appendChild(hint); return; }
  for (let i = state.elements.length - 1; i >= 0; i--) {
    const el = state.elements[i];
    const item = document.createElement('div');
    item.className = 'layer-row' + (state.selectedIndex === i ? ' selected' : '');
    item.addEventListener('click', (e) => { if (e.target.dataset.act) return; selectLayer(i); });
    const icon = document.createElement('span'); icon.className = 'layer-icon';
    icon.textContent = el.type === 'image' ? '▣' : el.type === 'text' ? 'T' : el.type === 'textbox' ? '▭' : el.type === 'card' ? '▤' : el.type === 'window' ? '▥' : el.shape === 'line' ? '╱' : el.shape === 'arrow' ? '➤' : el.shape === 'ellipse' ? '◯' : el.shape === 'star' ? '★' : '▢';
    item.appendChild(icon);
    const label = document.createElement('div'); label.className = 'layer-name';
    const layerLabel = el.type === 'card' ? (el.text || 'card') : el.type === 'textbox' ? (el.text || 'textbox') : el.type === 'window' ? (el.title || 'window') : el.type === 'box' ? (el.shape && el.shape !== 'rect' ? el.shape : 'shape') : (el.text || el.type);
    label.textContent = layerLabel.replace(/\n/g, ' ').slice(0, 20); item.appendChild(label);

    const up = document.createElement('button'); up.type = 'button'; up.dataset.act = '1'; up.className = 'layer-btn'; up.textContent = '▲'; up.setAttribute('aria-label', 'Move layer up'); up.disabled = i === state.elements.length - 1; up.classList.toggle('disabled', up.disabled); up.addEventListener('click', () => moveLayer(i, 1)); item.appendChild(up);
    const down = document.createElement('button'); down.type = 'button'; down.dataset.act = '1'; down.className = 'layer-btn'; down.textContent = '▼'; down.setAttribute('aria-label', 'Move layer down'); down.disabled = i === 0; down.classList.toggle('disabled', down.disabled); down.addEventListener('click', () => moveLayer(i, -1)); item.appendChild(down);
    const del = document.createElement('button'); del.type = 'button'; del.dataset.act = '1'; del.className = 'layer-btn del'; del.textContent = '×'; del.setAttribute('aria-label', 'Delete layer'); del.addEventListener('click', () => deleteAtIndex(i)); item.appendChild(del);
    elLayers.appendChild(item);
  }
}

function addColorRow(row, text, value, onChange) {
  label(row, text);
  let transparent = String(value).trim().toLowerCase() === 'transparent';
  const initial = transparent ? { hex: '#000000', alpha: 100 } : parseCssColor(value);
  let alpha = initial.alpha;
  const inp = document.createElement('input'); inp.type = 'color'; inp.className = 'cmp-color'; inp.value = initial.hex;
  const hex = document.createElement('button'); hex.type = 'button'; hex.className = 'cmp-hex';
  const colorLabel = (colorHex, alphaPct) => { const h = normHex(colorHex).toUpperCase(); return alphaPct >= 100 ? h : h + ' ' + Math.round(alphaPct) + '%'; };
  const apply = (colorHex, alphaPct, isTransparent) => {
    hex.textContent = isTransparent ? 'TRANSPARENT' : colorLabel(colorHex, alphaPct);
    onChange(isTransparent ? 'transparent' : colorToCss(colorHex, alphaPct));
  };
  hex.textContent = transparent ? 'TRANSPARENT' : colorLabel(initial.hex, alpha);
  inp.addEventListener('input', () => { transparent = false; beginChange(); apply(inp.value, alpha, false); });
  inp.addEventListener('change', () => commitChange());
  hex.addEventListener('click', () => {
    const startValue = transparent ? 'transparent' : colorToCss(inp.value, alpha);
    openColorPicker({
      title: text.toUpperCase(), current: inp.value, alpha: alpha,
      onLive: (c) => { beginChange(); transparent = false; alpha = c.alpha; inp.value = normHex(c.hex); apply(c.hex, c.alpha, false); },
      onDone: (c) => {
        const finalColor = colorToCss(c.hex, c.alpha);
        if (finalColor !== startValue) beginChange(); else cancelChange();
        transparent = false; alpha = c.alpha; inp.value = normHex(c.hex); apply(c.hex, c.alpha, false);
        if (finalColor !== startValue) commitChange();
      },
      onCancel: () => {
        if (startValue === 'transparent') {
          transparent = true; alpha = 100; inp.value = '#000000'; hex.textContent = 'TRANSPARENT'; onChange('transparent'); cancelChange();
        } else {
          const p = parseCssColor(startValue); transparent = false; alpha = p.alpha; inp.value = p.hex; apply(p.hex, p.alpha, false); cancelChange();
        }
      }
    });
  });
  row.appendChild(inp); row.appendChild(hex);
}

function addRangeRow(row, text, value, min, max, step, onInput, format) {
  label(row, text);
  const inp = document.createElement('input'); inp.type = 'range'; inp.className = 'cmp-range'; inp.min = min; inp.max = max; inp.step = step; inp.value = value;
  const val = document.createElement('span'); val.className = 'cmp-val'; val.textContent = format ? format(+inp.value) : String(inp.value);
  inp.addEventListener('input', () => { beginChange(); val.textContent = format ? format(+inp.value) : inp.value; onInput(+inp.value); });
  inp.addEventListener('change', () => commitChange());
  row.appendChild(inp); row.appendChild(val);
}

function addSelectRow(row, text, value, options, onChange) {
  label(row, text);
  const sel = document.createElement('select'); sel.className = 'cmp-select';
  for (const opt of options) {
    const optValue = Array.isArray(opt) ? opt[0] : opt;
    const optText = Array.isArray(opt) ? opt[1] : opt;
    const o = document.createElement('option'); o.value = optValue; o.textContent = optText;
    if (String(optValue) === String(value)) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { beginChange(); onChange(sel.value); commitChange(); });
  row.appendChild(sel);
}

function addAlignRow(row, value, onChange) {
  label(row, 'Align');
  const wrap = document.createElement('div'); wrap.className = 'cmp-seg';
  let current = value === 'center' || value === 'right' ? value : 'left';
  for (const [v, text] of [['left', 'LEFT'], ['center', 'CENTER'], ['right', 'RIGHT']]) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.dataset.align = v;
    btn.className = 'p-btn' + (current === v ? ' active' : ''); btn.textContent = text; btn.setAttribute('aria-label', v + ' align');
    btn.addEventListener('click', () => {
      if (current === v) return;
      current = v;
      for (const b of wrap.querySelectorAll('.p-btn')) b.classList.toggle('active', b.dataset.align === v);
      beginChange(); onChange(v); commitChange(); requestRender();
    });
    wrap.appendChild(btn);
  }
  row.appendChild(wrap);
}

function addNumberRow(row, text, value, min, max, onChange) {
  label(row, text);
  const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'cmp-num'; inp.min = min; inp.max = max; inp.value = value;
  inp.addEventListener('input', () => { const v = parseFloat(inp.value); if (!isFinite(v)) return; beginChange(); onChange(v); });
  inp.addEventListener('change', () => commitChange());
  row.appendChild(inp);
}

function setTool(tool) { state.activeTool = tool; for (const b of elTools) b.classList.toggle('active', b.dataset.tool === tool); updateStatus(); requestRender(); }
for (const btn of elTools) { btn.addEventListener('click', () => setTool(btn.dataset.tool)); }

function setSidePanelOpen(isOpen) {
  elSide.classList.toggle('open', isOpen);
  elScrim.classList.toggle('open', isOpen);
  elPanel.textContent = isOpen ? '›' : '‹';
  elPanel.setAttribute('aria-expanded', String(isOpen));
}
elUndo.addEventListener('click', undo); elRedo.addEventListener('click', redo); elSave.addEventListener('click', exportPNG); elPanel.addEventListener('click', () => setSidePanelOpen(!elSide.classList.contains('open'))); elScrim.addEventListener('click', () => setSidePanelOpen(false)); elMenu.addEventListener('click', openMenu);
elTabs.forEach((tab) => { tab.addEventListener('click', () => { elTabs.forEach((t) => t.classList.toggle('active', t === tab)); document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.id === tab.dataset.target)); }); });

function exportPNG() {
  const out = document.createElement('canvas'); out.width = state.width; out.height = state.height; const octx = out.getContext('2d'); octx.setTransform(1, 0, 0, 1, 0, 0);
  const editing = editingTextEl; editingTextEl = null; drawScene(octx); editingTextEl = editing;
  out.toBlob((blob) => { if (!blob) { showToast('EXPORT FAILED'); return; } const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'composite.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); showToast('SAVED COMPOSITE.PNG'); }, 'image/png');
}

function openMenu() {
  elSheet.innerHTML = '';
  const head = document.createElement('div'); head.className = 'menu-head'; head.innerHTML = '<span>MENU</span>';
  const closeB = document.createElement('button'); closeB.type = 'button'; closeB.className = 'menu-x'; closeB.textContent = '×'; closeB.setAttribute('aria-label', 'Close menu'); closeB.addEventListener('click', closeMenu); head.appendChild(closeB);
  const grid = document.createElement('div'); grid.className = 'menu-grid';
  const addCard = (label, meta, action, danger) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'menu-card' + (danger ? ' danger' : '');
    b.innerHTML = '<span class="menu-label">' + label + '</span><span class="menu-meta">' + meta + '</span>';
    b.addEventListener('click', () => action()); grid.appendChild(b);
  };
  addCard('Add card', 'TEXT BOX', () => { closeMenu(); addCardLayer(); });
  addCard('Add OS Window', 'UI MOCKUP', () => { closeMenu(); addWindowLayer(); });
  addCard('Add image', 'FILE', () => { closeMenu(); elImgFile.click(); });
  addCard('Background', state.backgroundRecipe ? 'GENERATED' : state.backgroundImage ? 'IMAGE' : 'STUDIO', () => { closeMenu(); openBackgroundStudio(); });
  addCard('Fit view', 'RESET', () => { closeMenu(); fitToView(); requestRender(); showToast('VIEW FITTED'); });
  addCard('Clear all', state.elements.length ? state.elements.length + ' LAYERS' : 'EMPTY', () => { closeMenu(); clearAll(); }, true);
  elSheet.appendChild(head); elSheet.appendChild(grid);
  elOverlay.classList.add('open'); elSheet.classList.add('open');
}
function closeMenu() { elOverlay.classList.remove('open'); elSheet.classList.remove('open'); }
elOverlay.addEventListener('click', closeMenu);
elBgTop.addEventListener('click', openBackgroundStudio);
elBgStudioClose.addEventListener('click', closeBackgroundStudio);
elBgCancelStudio.addEventListener('click', closeBackgroundStudio);
elBgStudio.addEventListener('click', (e) => { if (e.target === elBgStudio) closeBackgroundStudio(); });
elBgStudio.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeBackgroundStudio(); return; }
  if (e.key !== 'Tab') return;
  const focusables = Array.from(elBgStudio.querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])'))
    .filter((node) => !node.disabled && node.tabIndex >= 0 && node.getClientRects().length > 0);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (!elBgStudio.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
elBgApply.addEventListener('click', applyBackgroundStudio);
elBgRandom.addEventListener('click', randomizeBackgroundDraft);
elBgImport.addEventListener('click', () => { closeBackgroundStudio(); elBgFile.click(); });

function isTyping(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }
window.addEventListener('keydown', (e) => {
  if (bgStudioOpen) { if (e.key === 'Escape') { e.preventDefault(); closeBackgroundStudio(); } return; }
  if (e.code === 'Space' && !isTyping(e)) { spaceDown = true; canvas.style.cursor = 'grab'; e.preventDefault(); return; }
  if (isTyping(e)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); exportPNG(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
  if (e.key === 'Escape') { if (elTextEditor.classList.contains('open')) { elTextInput.blur(); return; } if (elSheet.classList.contains('open')) { closeMenu(); return; } selectElement(-1); return; }
  const k = e.key.toLowerCase();
  if (mod) return;
  if (k === 'v') setTool('select'); else if (k === 'b') setTool('box'); else if (k === 't') setTool('text'); else if (k === 'x') setTool('textbox'); else if (k === 'c') setTool('card'); else if (k === 'i') setTool('image'); else if (k === 'g') openBackgroundStudio();
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; canvas.style.cursor = ''; } });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault(); const p = canvasPoint(e); const zOld = state.zoom; const zNew = clamp(zOld * Math.exp(-e.deltaY * 0.0015), 0.05, 16); if (zNew === zOld) return;
  const before = screenToDoc(p.x, p.y); state.zoom = zNew; state.panX += (before.x - state.width / 2) * (zOld - zNew); state.panY += (before.y - state.height / 2) * (zOld - zNew); updateStatus(); requestRender();
}, { passive: false });

function fitToView() { const W = canvas.clientWidth, H = canvas.clientHeight; if (!W || !H) return; state.zoom = clamp(Math.min(W / state.width, H / state.height) * 0.88, 0.05, 8); state.panX = 0; state.panY = 0; updateStatus(); }
function updateStatus() { sbZoom.textContent = Math.round(state.zoom * 100) + '%'; sbLayers.textContent = state.elements.length + (state.elements.length === 1 ? ' LAYER' : ' LAYERS'); sbTool.textContent = state.activeTool === 'box' ? 'SHAPE' : state.activeTool === 'textbox' ? 'TEXT BOX' : state.activeTool === 'card' ? 'CARD' : state.activeTool.toUpperCase(); }

function init() {
  updateUndoButtons(); buildProperties(); setTool('select');
  if (window.innerWidth <= 820) setSidePanelOpen(false);
  if (window.ResizeObserver) { new ResizeObserver(() => requestRender()).observe(viewport); }
  window.addEventListener('resize', requestRender);
  requestAnimationFrame(() => { fitToView(); requestRender(); });
}
init();
</script>
